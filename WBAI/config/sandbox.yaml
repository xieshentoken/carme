# ============================================================
#  执行环境 —— 对应 Grok Bot 里「每个 Bot 一台专属云计算机」
#  ------------------------------------------------------------
#  三种模式，可全局设默认、也可按 bot 覆盖（在 agents.yaml 里写 sandbox: xxx）
#
#   local  : 在本机一个受限工作目录里直接跑命令。
#            零依赖、立刻可用。适合先跑通链路。
#            注意：它不是安全沙箱，绝对路径仍能碰到宿主文件。
#
#   docker : 兼容现有本地开发；不是首版执行 MacBook 的必需依赖。
#
#   remote : 通过 SSH 把命令丢到远端节点（你那台 2018 款）执行。
#            对应 Grok Bot「Bot 有自己一台机器」的形态，
#            也是把重活从开发机挪走的正解。
# ============================================================
version: 2

default_mode: remote
default_node_id: ""  # 配置真实 SSH 信息并测试后选择；不推测执行机地址

modes:

  local:
    # 共享根：同一个 workspace 下的任务目录互相可见（接力任务才能捡起上一个任务的产物）
    root: ./data/workspaces
    # 每次任务一个独立子目录，形如 <root>/<agent_id>/<task_id>/
    # 相对路径落在这个子目录里；跨任务读写要用从共享根开始的完整路径
    per_task_dir: true
    # 命令白名单关闭（开发期方便），上线后建议打开
    enforce_allowlist: false
    allowlist:
      - ls
      - cat
      - head
      - tail
      - wc
      - grep
      - find
      - python
      - python3
      - pip
      - node
      - npm
      - curl
      - git
    timeout_seconds: 120
    max_output_bytes: 200000

  docker:
    image: carme/sandbox:latest
    # 8GB 机器上别给多，1 个容器 2G 是安全值
    memory: 2g
    cpus: 2.0
    pids_limit: 256
    network: true                # 允许出网（查资料、装依赖）
    workdir: /workspace
    # 容器启动后执行一次的初始化
    setup_command: "apt-get update -qq && apt-get install -y -qq git curl python3 python3-pip >/dev/null 2>&1 || true"
    auto_remove: true
    timeout_seconds: 300

  remote:
    # 远端节点（2018 款 MacBook Pro）
    host: ""                     # 例：carme-node.local  或  192.168.1.50
    port: 22
    user: ""                     # 例：carme-node
    identity_file: ~/.ssh/id_ed25519
    # 远端工作根目录（共享根）：相对路径落在 <root>/<agent_id>/<task_id>，
    # 跨任务读写要用从根开始的完整路径（可写 ~/... 形式）
    root: ~/carme-node/workspaces
    # 首版执行 MacBook 直接走 SSH，无需安装 Docker 或本地模型。
    use_docker: false
    docker_memory: 2g
    # 健康检查
    health_check_command: "uname -a && df -h / | tail -1 && vm_stat | head -3"
    connect_timeout: 10
    timeout_seconds: 300
    # 断线应明确失败，禁止切到后端 Mac 执行。
    fallback: none

# ---------- 全局资源闸门（8GB 机器务必保守）----------
limits:
  max_concurrent_tasks: 3        # 同时运行的任务总数
  max_concurrent_sandbox: 1      # 同时占用的沙箱数 —— 低配机的关键阀门
  max_task_seconds: 900
  max_daily_tasks: 200

# ---------- Bot 背后的可替换执行电脑；后端和用户客户端不在此登记 ----------
nodes:
  - node_id: mbp2018
    name: 2018 MacBook
    host: ""
    port: 22
    user: ""
    identity_file: ""  # 后端 SSH 私钥文件路径，不保存私钥内容
    root: ~/carme-node/workspaces
    connect_timeout: 10
    browser:
      cdp_host: 127.0.0.1
      cdp_port: 9222
    desktop:
      enabled: false
      vnc_port: 5900
